# Required overlay for a release using the new AWS-stored Resend credential.
# The host file must be staged in verified tmpfs by stage_resend_secret.py.
services:
  api:
    environment:
      MAIL_PROVIDER: resend
      MAIL_FROM: accounts@fafa888.uk
      MAIL_API_KEY: ''
      MAIL_API_KEY_FILE: /run/secrets/resend_api_key
    secrets: [resend_api_key]
secrets:
  resend_api_key:
    file: ${FAFA_RESEND_SECRET_FILE:?stage the AWS secret in host tmpfs first}
