name: fafa-one
x-runtime: &runtime
  image: fafa-one-runtime:${IMAGE_TAG:?set IMAGE_TAG}
  env_file:
    - path: ../../.env.runtime
      required: false
  environment: &runtime_environment
    NODE_ENV: production
    DEV_MOCK_LOGIN: 'false'
    DEMO_MODE: 'false'
    API_PORT: '4000'
    WEB_ORIGIN: ${WEB_ORIGIN:-https://fafa888.uk}
    ADMIN_ORIGIN: ${ADMIN_ORIGIN:-https://a.fafa888.uk}
    API_PUBLIC_URL: ${API_PUBLIC_URL:-https://fafa888.uk}
    GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://fafa888.uk/auth/google/callback}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?retain existing encryption key}
    ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-v1}
    ENCRYPTION_PREVIOUS_KEYS_JSON: ${ENCRYPTION_PREVIOUS_KEYS_JSON:-}
    COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    SSH_ALLOWED_TARGETS: ${SSH_ALLOWED_TARGETS:-}
    SSH_INTERACTIVE_ENABLED: ${SSH_INTERACTIVE_ENABLED:-false}
    WLOC_SEARCH_ENABLED: ${WLOC_SEARCH_ENABLED:-true}
    WLOC_SEARCH_URL: ${WLOC_SEARCH_URL:-https://photon.komoot.io/api/}
    ANTHROPIC_API_ENABLED: ${ANTHROPIC_API_ENABLED:-false}
    PLATFORM_CODEX_ENABLED: ${PLATFORM_CODEX_ENABLED:-false}
    ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: { max-size: '10m', max-file: '3' }
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  read_only: true
  tmpfs: ['/tmp']
services:
  postgres:
    logging: *logging
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: fafa
      POSTGRES_USER: fafa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong password}
    volumes: ['pg:/var/lib/postgresql/data']
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fafa']
      interval: 5s
      timeout: 3s
      retries: 30
  migrate:
    <<: *runtime
    env_file: ../../.env.production
    command: ['node', '--import', 'tsx', 'packages/db/src/migrate.ts']
    restart: 'no'
    healthcheck: { disable: true }
    depends_on: { postgres: { condition: service_healthy } }
  ops:
    <<: *runtime
    env_file: ../../.env.production
    profiles: [tools]
    restart: 'no'
    logging: { driver: none }
    healthcheck: { disable: true }
  api:
    <<: *runtime
    environment:
      <<: *runtime_environment
      CHATGPT_WEB_AUTH_ENABLED: ${CHATGPT_WEB_AUTH_ENABLED:-false}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    <<: *runtime
    command: ['node', '--import', 'tsx', 'apps/worker/src/index.ts']
    healthcheck:
      test: ['CMD', 'node', '--import', 'tsx', 'infra/scripts/worker-health.ts']
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on: { migrate: { condition: service_completed_successfully } }
  web:
    logging: *logging
    image: fafa-one-web:${IMAGE_TAG:?set IMAGE_TAG}
    tmpfs: ['/config', '/data']
    restart: unless-stopped
  admin:
    logging: *logging
    image: fafa-one-admin:${IMAGE_TAG:?set IMAGE_TAG}
    tmpfs: ['/config', '/data']
    restart: unless-stopped
  proxy:
    logging: *logging
    image: caddy:2.10.2-alpine
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:-fafa888.uk}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-a.fafa888.uk}
    volumes:
      [
        '../reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro',
        'caddy:/data',
        'caddy_config:/config',
      ]
    restart: unless-stopped
    depends_on: [api, web, admin]
volumes: { pg: {}, caddy: {}, caddy_config: {} }
