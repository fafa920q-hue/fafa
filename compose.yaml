services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: fafa
      POSTGRES_USER: fafa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fafa_dev_only}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['fafa_pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fafa']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  fafa_pg:
