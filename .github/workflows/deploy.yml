name: FAFA ONE protected production
on:
  push:
    branches: [feat/fafa-one-control-panel]
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: fafa-production
  cancel-in-progress: false
jobs:
  preflight:
    if: vars.FAFA_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: { contents: read, actions: read, deployments: read }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Verify existing environment protection and successful CI for this SHA
        env: { GH_TOKEN: '${{ github.token }}' }
        run: python3 infra/deploy/ssm_deploy.py preflight
  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://fafa888.uk
    permissions: { contents: read, deployments: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Require existing non-secret deployment settings
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        run: test -n "$AWS_ROLE_ARN" && test -n "$AWS_REGION" && test -n "$AWS_INSTANCE_ID"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: fafa-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Deploy via existing SSM, no SSH/AWS long-lived secrets
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        run: python3 infra/deploy/ssm_deploy.py deploy
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify public HTTPS and capture PC/iPhone login pages only
        run: pnpm exec tsx infra/scripts/verify-production.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-public-evidence
          path: docs/evidence/production/
