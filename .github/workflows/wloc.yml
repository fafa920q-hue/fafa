name: WLOC branch diagnostics
on:
  push:
    branches: [feat/wloc-location-center]
concurrency:
  group: wloc-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  checks:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          {
            POSTGRES_DB: fafa,
            POSTGRES_USER: fafa,
            POSTGRES_PASSWORD: fafa_dev_only,
          }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fafa" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx infra/scripts/init-env.ts
      - name: Check formatting and retain corrective diff
        run: |
          if ! pnpm format:check; then
            pnpm exec prettier --write . > /dev/null
            node -e 'const fs=require("node:fs"); const cp=require("node:child_process"); for (const path of cp.execFileSync("git",["diff","--name-only"],{encoding:"utf8"}).trim().split("\n").filter(Boolean)) console.log("WLOC_FORMAT_JSON="+JSON.stringify({path,content:fs.readFileSync(path,"utf8")}));'
            exit 1
          fi
      - run: pnpm lint && pnpm typecheck
        if: ${{ !cancelled() }}
      - run: pnpm test
        if: ${{ !cancelled() }}
      - run: bash -n infra/scripts/deploy-production.sh infra/scripts/production-compose.sh infra/scripts/backup-production.sh
      - run: python3 -m unittest discover -s infra/deploy -p 'test_*.py'
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm test && pnpm test:integration && pnpm build
      - run: pnpm security && pnpm audit --audit-level=moderate
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify WLOC operations before full shared regression
        run: pnpm exec playwright test tests/e2e/accessibility.spec.ts tests/e2e/wloc.spec.ts --project=chromium --project=webkit --max-failures=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wloc-browser-evidence
          path: |
            docs/screenshots/
            docs/evidence/playwright.json
            test-results/
