name: Member delivery source formatting
on:
  push:
    branches: [feat/member-auth-delivery]
permissions: { contents: write }
concurrency:
  group: member-delivery-source-format
  cancel-in-progress: true
jobs:
  format-source:
    if: github.repository == 'fafa920q-hue/fafa' && github.ref == 'refs/heads/feat/member-auth-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Format tracked delivery changes only
        run: |
          git diff --name-only -z b623dac1420f07f0b54077ec0d87c059fe1dd13f HEAD -- . ':!.github/workflows/**' |
            xargs -0 -r pnpm exec prettier --write --ignore-unknown
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --update
            git commit -m 'style: format member delivery source'
            git push origin HEAD:feat/member-auth-delivery
          fi
