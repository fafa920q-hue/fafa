name: fafa-one-alpha
x-api: &api
  image: fafa-one-api:2.0.0-alpha.1
  build: ./backend
  env_file: ${FAFA_ENV_FILE:-.env}
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fafa:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/fafa}
    APP_SECRET: ${APP_SECRET:?Set a random APP_SECRET}
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://fafa888.uk}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
  volumes:
    - app_data:/data
    - ${SECRETS_HOST_DIR:-./secrets}:/run/secrets:ro
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  mem_limit: 768m
  cpus: 1.5
  pids_limit: 128
  networks: [internal]
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fafa
      POSTGRES_DB: fafa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fafa -d fafa"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  api:
    <<: *api
    depends_on:
      migrate: {condition: service_completed_successfully}
    expose: ["8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    image: fafa-one-web:2.0.0-alpha.1
    build: ./frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  internal: {}
volumes:
  app_data:
  pg_data:
